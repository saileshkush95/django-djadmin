{% load i18n djadmin %}
<div class="dj-overlay dj-palette" id="dj-palette" hidden data-endpoint="{{ dj_palette_url }}">
  <div class="dj-overlay-backdrop" data-dj-palette-close></div>
  <div class="dj-palette-box" role="dialog" aria-modal="true" aria-label="{% translate 'Search the admin' %}">
    <div class="dj-palette-field">
      {% dj_icon "search" "dj-icon dj-icon--sm" %}
      <input type="text" id="dj-palette-input" autocomplete="off" spellcheck="false"
             placeholder="{% translate 'Search models and records…' %}" aria-controls="dj-palette-results">
      <kbd class="dj-kbd">esc</kbd>
    </div>
    <div class="dj-palette-results" id="dj-palette-results" role="listbox" tabindex="-1"></div>
    <div class="dj-palette-foot">
      <span><kbd class="dj-kbd">↑</kbd><kbd class="dj-kbd">↓</kbd> {% translate 'navigate' %}</span>
      <span><kbd class="dj-kbd">↵</kbd> {% translate 'open' %}</span>
      <span><kbd class="dj-kbd">esc</kbd> {% translate 'close' %}</span>
    </div>
  </div>
</div>
